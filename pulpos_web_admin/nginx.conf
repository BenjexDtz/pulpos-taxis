server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # __API_URL__ lo reemplaza el Dockerfile con VITE_API_URL; Leaflet llega de unpkg, los mapas de OSM y los logos de cualquier https
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' __API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
