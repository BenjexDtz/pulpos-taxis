# ═══════════════════════════════════════════════════════════════════════════════
# Radio Taxis Pulpos — Docker Compose
# Levanta: PostgreSQL + PostgreSQL de auditoría + Backend Node.js + Panel Web Admin
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pulpos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pulpos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulpos2026}
      POSTGRES_DB: ${DB_NAME:-pulpos_db}
    volumes:
      # Persistencia de datos entre reinicios
      - pulpos_db_data:/var/lib/postgresql/data
      # Script de inicialización (crea tablas automáticamente al primer arranque)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulpos} -d ${DB_NAME:-pulpos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Base de datos de auditoría (servidor separado) ──────────────────────────
  auditoria:
    image: postgres:16-alpine
    container_name: pulpos_auditoria
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUDIT_ADMIN_USER:-auditoria_admin}
      POSTGRES_PASSWORD: ${AUDIT_ADMIN_PASSWORD:-auditoria2026}
      POSTGRES_DB: pulpos_auditoria
      AUDIT_APP_PASSWORD: ${AUDIT_APP_PASSWORD:-auditor_app2026}
    volumes:
      - pulpos_auditoria_data:/var/lib/postgresql/data
      - ./database/auditoria:/auditoria:ro
      - ./database/auditoria/inicializar.sh:/docker-entrypoint-initdb.d/inicializar.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_ADMIN_USER:-auditoria_admin} -d pulpos_auditoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./pulpos_backend
      dockerfile: Dockerfile
    container_name: pulpos_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auditoria:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-pulpos}
      DB_PASSWORD: ${DB_PASSWORD:-pulpos2026}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pulpos_db}
      JWT_SECRET: ${JWT_SECRET:-cambia_esto_por_una_clave_segura}
      MFA_CLAVE: ${MFA_CLAVE:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-pulpos2026}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AUDIT_DB_HOST: auditoria
      AUDIT_DB_PORT: 5432
      AUDIT_DB_NAME: pulpos_auditoria
      AUDIT_DB_USER: auditor_app
      AUDIT_DB_PASSWORD: ${AUDIT_APP_PASSWORD:-auditor_app2026}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_URL: ${LLM_URL:-https://api.groq.com/openai/v1}
      LLM_MODELO: ${LLM_MODELO:-openai/gpt-oss-120b}
    ports:
      - "3000:3000"
    healthcheck:
      # localhost resuelve a ::1 en Alpine y el backend escucha solo en IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Panel Web Admin (React) ──────────────────────────────────────────────────
  web_admin:
    build:
      context: ./pulpos_web_admin
      dockerfile: Dockerfile
      args:
        # URL del backend que verá el navegador del revisor
        VITE_API_URL: http://localhost:3000
    container_name: pulpos_web_admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

# ── Volúmenes persistentes ────────────────────────────────────────────────────
volumes:
  pulpos_db_data:
    driver: local
  pulpos_auditoria_data:
    driver: local