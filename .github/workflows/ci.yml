name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulpos_backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulpos
          POSTGRES_PASSWORD: pulpos_ci
          POSTGRES_DB: pulpos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulpos -d pulpos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_INTEGRACION: "1"
      DB_USER: pulpos
      DB_PASSWORD: pulpos_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pulpos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulpos_backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web_admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulpos_web_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulpos_web_admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulpos_apk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
